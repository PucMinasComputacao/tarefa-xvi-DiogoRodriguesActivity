<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <link rel="stylesheet" href="../../styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center justify-content-center" style="min-height:100vh">

  <div style="width:320px">
    <h2 class="mb-1 text-center">🎬 Login</h2>
    <p class="text-center text-secondary mb-4" style="font-size:0.85rem">Acesse sua conta</p>
    <p id="msg-erro" class="text-danger text-center" style="display:none"></p>

    <div class="mb-3">
      <label class="form-label">Login</label>
      <input type="text" id="input-login" class="form-control bg-dark text-white border-secondary">
    </div>
    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" id="input-senha" class="form-control bg-dark text-white border-secondary">
    </div>
    <button id="btn-entrar" class="btn w-100 fw-bold mb-3" style="background:#e8b14b;color:#111">Entrar</button>
    <p class="text-center text-secondary" style="font-size:0.85rem">
      Não tem conta? <a href="../cadastro/index.html" class="text-warning">Cadastrar-se</a>
    </p>
  </div>

  <script src="../../login.js"></script>
  <script>
    document.getElementById("btn-entrar").addEventListener("click", async () => {
      const login = document.getElementById("input-login").value.trim();
      const senha = document.getElementById("input-senha").value.trim();
      const erro  = document.getElementById("msg-erro");

      const usuario = await loginUser(login, senha);
      if (usuario) {
        window.location.href = "../../index.html";
      } else {
        erro.textContent = "Login ou senha inválidos.";
        erro.style.display = "block";
      }
    });

    // Enter também loga
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("btn-entrar").click();
    });
  </script>
</body>
</html>
