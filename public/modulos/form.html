<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Itens</title>
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../login.js"></script>
</head>
<body class="bg-dark text-white">

  <header class="bg-secondary p-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <a href="../index.html" class="text-white text-decoration-none fw-bold">← Voltar</a>
        <h1 id="titulo-pagina" style="font-size:1.2rem">➕ Cadastro de Itens</h1>
        <div id="area-login"></div>
      </div>
    </div>
  </header>

  <section class="container py-4" style="max-width:650px">
    <p id="message" class="text-danger mb-3"></p>

    <!-- Formulário -->
    <div class="card bg-dark border-secondary mb-5 p-4">
      <h5 id="form-titulo" class="mb-4 text-warning">Inserir novo item</h5>
      <input type="hidden" id="item-id">

      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" id="titulo" class="form-control bg-dark text-white border-secondary">
      </div>
      <div class="row">
        <div class="col mb-3">
          <label class="form-label">Tipo</label>
          <select id="tipo" class="form-select bg-dark text-white border-secondary">
            <option value="filme">Filme</option>
            <option value="serie">Série</option>
          </select>
        </div>
        <div class="col mb-3">
          <label class="form-label">Categoria</label>
          <input type="text" id="categoria" class="form-control bg-dark text-white border-secondary" placeholder="Ex: Ação, Drama">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Nota (0–10)</label>
        <input type="number" id="nota" class="form-control bg-dark text-white border-secondary" min="0" max="10" step="0.1">
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição Curta</label>
        <input type="text" id="descricaoCurta" class="form-control bg-dark text-white border-secondary">
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição Completa</label>
        <textarea id="descricaoCompleta" class="form-control bg-dark text-white border-secondary" rows="3"></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">URL da Imagem</label>
        <input type="text" id="imagem" class="form-control bg-dark text-white border-secondary" placeholder="assets/img/foto.jpg">
      </div>
      <div class="mb-3">
        <label class="form-label">Destaque</label>
        <select id="destaque" class="form-select bg-dark text-white border-secondary">
          <option value="false">Não</option>
          <option value="true">Sim</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label">Tags (separadas por vírgula)</label>
        <input type="text" id="tags" class="form-control bg-dark text-white border-secondary" placeholder="ação, drama, brasil">
      </div>

      <div class="d-flex gap-2">
        <button id="btn-inserir" class="btn fw-bold flex-fill" style="background:#e8b14b;color:#111" onclick="salvar('POST')">Inserir</button>
        <button id="btn-alterar" class="btn fw-bold flex-fill btn-outline-warning" onclick="salvar('PUT')" disabled>Alterar</button>
        <button id="btn-excluir" class="btn fw-bold flex-fill btn-outline-danger" onclick="excluir()" disabled>Excluir</button>
        <button class="btn btn-outline-secondary" onclick="limparForm()">Limpar</button>
      </div>
    </div>

    <!-- Listagem -->
    <h5 class="mb-3 text-warning">Listagem de Itens</h5>
    <div class="table-responsive">
      <table class="table table-dark table-hover table-bordered align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Tipo</th>
            <th>Nota</th>
            <th>Ação</th>
          </tr>
        </thead>
        <tbody id="tabela-itens">
          <tr><td colspan="5" class="text-center text-secondary">Carregando...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <script src="form.js"></script>
  <script>initLoginApp();</script>
</body>
</html>
