<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário</title>
  <link rel="stylesheet" href="../styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="../login.js"></script>
</head>
<body class="bg-dark text-white">

  <header class="bg-secondary p-3">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
        <a href="../index.html" class="text-white text-decoration-none fw-bold mt-2 mt-md-0">← Voltar</a>
        <h1 id="titulo-pagina" style="font-size:1.2rem">➕ Novo Item</h1>
        <div id="area-login"></div>
      </div>
    </div>
  </header>

  <section class="container py-5" style="max-width:600px">
    <p id="message" class="text-danger mb-3"></p>

    <div class="mb-3">
      <label class="form-label">Título</label>
      <input type="text" id="titulo" class="form-control bg-dark text-white border-secondary">
    </div>

    <div class="mb-3">
      <label class="form-label">Tipo</label>
      <select id="tipo" class="form-select bg-dark text-white border-secondary">
        <option value="filme">Filme</option>
        <option value="serie">Série</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Categoria</label>
      <input type="text" id="categoria" class="form-control bg-dark text-white border-secondary" placeholder="Ex: Ação, Drama, Animação">
    </div>

    <div class="mb-3">
      <label class="form-label">Nota (0–10)</label>
      <input type="number" id="nota" class="form-control bg-dark text-white border-secondary" min="0" max="10" step="0.1">
    </div>

    <div class="mb-3">
      <label class="form-label">Descrição Curta</label>
      <input type="text" id="descricaoCurta" class="form-control bg-dark text-white border-secondary">
    </div>

    <div class="mb-3">
      <label class="form-label">Descrição Completa</label>
      <textarea id="descricaoCompleta" class="form-control bg-dark text-white border-secondary" rows="4"></textarea>
    </div>

    <div class="mb-3">
      <label class="form-label">URL da Imagem</label>
      <input type="text" id="imagem" class="form-control bg-dark text-white border-secondary" placeholder="assets/img/foto.jpg">
    </div>

    <div class="mb-4">
      <label class="form-label">Tags (separadas por vírgula)</label>
      <input type="text" id="tags" class="form-control bg-dark text-white border-secondary" placeholder="ação, drama, brasil">
    </div>

    <button id="btn-salvar" class="btn w-100 fw-bold" style="background:#e8b14b;color:#111">Salvar</button>
  </section>

  <script src="form.js"></script>
  <script>initLoginApp();</script>
</body>
</html>
